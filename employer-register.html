<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Employer Registration | FairChanceFinder</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="styles.css" />

  <style>
    /* Page-specific overrides */
    .auth-wrapper {
      max-width: 460px;
      margin: 4rem auto;
      padding: 2rem;
      background: rgba(15, 23, 42, 0.98);
      border-radius: 18px;
      border: 1px solid rgba(148, 163, 184, 0.25);
      box-shadow: 0 18px 45px rgba(0,0,0,0.45);
    }
    .auth-wrapper h1 {
      margin-top: 0;
      font-size: 1.6rem;
      text-align: center;
    }
    .auth-wrapper p {
      text-align: center;
      color: #9ca3af;
      margin-bottom: 1.5rem;
    }
    .auth-wrapper .input {
      margin-bottom: 1rem;
    }
    .auth-wrapper .btn-full {
      margin-top: 0.5rem;
    }
    .auth-links {
      margin-top: 1rem;
      text-align: center;
      font-size: 0.85rem;
    }
    .auth-links a {
      color: #7a4fff;
      text-decoration: underline;
    }
    .auth-status {
      display: none;
      margin: 0 0 1rem;
      padding: 0.75rem 1rem;
      border-radius: 10px;
      background: rgba(16, 185, 129, 0.12);
      color: #a7f3d0;
      font-size: 0.9rem;
      text-align: center;
    }
    .auth-status.error {
      background: rgba(239, 68, 68, 0.12);
      color: #fecaca;
    }
  </style>
</head>

<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo">
        <img src="assets/logo.svg" alt="FairChanceFinder logo" />
        <span>FairChanceFinder</span>
      </a>
      <nav class="main-nav">
        <a href="index.html" class="nav-link">Home</a>
        <a href="employers.html" class="nav-link active">Employers</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="auth-wrapper">
      <h1>Create Employer Account</h1>
      <p>Post jobs, track performance, and manage your fair-chance hiring.</p>

      <div id="authStatus" class="auth-status" role="status" aria-live="polite"></div>

      <form id="registerForm">
        <input type="text" id="company" class="input" placeholder="Company name" required />
        <input type="email" id="email" class="input" placeholder="Work email" required />
        <input type="password" id="password" class="input" placeholder="Password" required />

        <button type="submit" class="btn btn-primary btn-full">Create Account</button>
      </form>

      <div class="auth-links">
        <p>Already have an account?
          <a href="employer-login.html">Log in</a>
        </p>
      </div>
    </div>
  </main>

  <script type="module">
    import { getUser, signup, AuthError, MissingIdentityError } from "https://esm.sh/@netlify/identity";

    const form = document.getElementById("registerForm");
    const status = document.getElementById("authStatus");

    function showStatus(message, isError = false) {
      status.textContent = message;
      status.classList.toggle("error", isError);
      status.style.display = "block";
    }

    async function redirectAuthenticatedUser() {
      const user = await getUser();
      if (user) {
        window.location.href = "employer-dashboard.html";
      }
    }

    redirectAuthenticatedUser();

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();
      const company = document.getElementById("company").value.trim();
      const submitButton = form.querySelector("button[type='submit']");

      if (!company) {
        showStatus("Please enter your company name.", true);
        return;
      }

      submitButton.disabled = true;
      submitButton.textContent = "Creating...";

      try {
        const user = await signup(email, password, {
          companyName: company,
          accountType: "employer"
        });

        if (user.emailVerified) {
          window.location.href = "employer-dashboard.html";
          return;
        }

        form.reset();
        showStatus("Account created. Please check your email to confirm your account before logging in.");
      } catch (err) {
        if (err instanceof MissingIdentityError) {
          showStatus("Registration is not available until Netlify Identity is enabled for this site.", true);
        } else if (err instanceof AuthError) {
          showStatus(err.status === 403 ? "Signups are disabled for this site." : err.message, true);
        } else {
          showStatus("Registration failed. Please try a different email.", true);
        }
      } finally {
        submitButton.disabled = false;
        submitButton.textContent = "Create Account";
      }
    });
  </script>
</body>
</html>
