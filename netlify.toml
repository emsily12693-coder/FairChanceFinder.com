[build]
  publish = "public"

  [[headers]]
    for = "/sw.js"
      [headers.values]
          Cache-Control = "no-cache"

          [[headers]]
            for = "/manifest.json"
              [headers.values]
                  Cache-Control = "no-cache"

                  [[headers]]
                    for = "/.well-known/assetlinks.json"
                      [headers.values]
                          Content-Type = "application/json"
