[build]
  command = ""
    publish = "."

    # Correct MIME headers for .well-known files
    [[headers]]
      for = "/.well-known/assetlinks.json"
        [headers.values]
            Content-Type = "application/json"
                Access-Control-Allow-Origin = "*"

                # SPA fallback  force=false means existing static files are served first
                [[redirects]]
                  from = "/*"
                    to = "/index.html"
                      status = 200
                        force = false
