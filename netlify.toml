[build]
  command = ""
  publish = "."

# Correct MIME headers for .well-known files
[[headers]]
  for = "/.well-known/assetlinks.json"
    [headers.values]
      Content-Type = "application/json"
      Access-Control-Allow-Origin = "*"

# Explicit passthrough for .well-known (must be ABOVE SPA fallback)
[[redirects]]
  from = "/.well-known/*"
  to = "/.well-known/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/uploads"
  to = "/.netlify/functions/uploads"
  status = 200
  force = true

[[redirects]]
  from = "/job/:id"
  to = "/job.html?id=:id"
  status = 200

[[redirects]]
  from = "/employer-posting.html"
  to = "/employers.html"
  status = 301

[[redirects]]
  from = "/privacy-policy.html"
  to = "/privacy.html"
  status = 301

# SPA fallback — serves index.html for all other routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false
