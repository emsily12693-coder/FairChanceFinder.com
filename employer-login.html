<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Employer Login | FairChanceFinder</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="styles.css" />

  <style>
    /* Page-specific overrides */
    .auth-wrapper {
      max-width: 420px;
      margin: 4rem auto;
      padding: 2rem;
      background: rgba(15, 23, 42, 0.98);
      border-radius: 18px;
      border: 1px solid rgba(148, 163, 184, 0.25);
      box-shadow: 0 18px 45px rgba(0,0,0,0.45);
    }
    .auth-wrapper h1 {
      margin-top: 0;
      font-size: 1.6rem;
      text-align: center;
    }
    .auth-wrapper p {
      text-align: center;
      color: #9ca3af;
      margin-bottom: 1.5rem;
    }
    .auth-wrapper .input {
      margin-bottom: 1rem;
    }
    .auth-wrapper .btn-full {
      margin-top: 0.5rem;
    }
    .auth-links {
      margin-top: 1rem;
      text-align: center;
      font-size: 0.85rem;
    }
    .auth-links a {
      color: #7a4fff;
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo">
        <img src="assets/logo.svg" alt="FairChanceFinder logo" />
        <span>FairChanceFinder</span>
      </a>
      <nav class="main-nav">
        <a href="index.html" class="nav-link">Home</a>
        <a href="employers.html" class="nav-link active">Employers</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="auth-wrapper">
      <h1>Employer Login</h1>
      <p>Access your dashboard, manage job listings, and view analytics.</p>

      <form id="loginForm">
        <input type="email" id="email" class="input" placeholder="Email" required />
        <input type="password" id="password" class="input" placeholder="Password" required />

        <button type="submit" class="btn btn-primary btn-full">Log In</button>
      </form>

      <div class="auth-links">
        <p>Don't have an account?
          <a href="employer-register.html">Create one</a>
        </p>
      </div>
    </div>
  </main>

  <script type="module">
    import { getUser, login } from "https://esm.sh/@netlify/identity";

    async function redirectAuthenticatedUser() {
      const user = await getUser();
      if (user) {
        window.location.href = "employer-dashboard.html";
      }
    }

    redirectAuthenticatedUser();

    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();

      try {
        const user = await login(email, password);
        if (user) {
          window.location.href = "employer-dashboard.html";
        }
      } catch (err) {
        alert("Login failed. Please check your email and password.");
      }
    });
  </script>
</body>
</html>
