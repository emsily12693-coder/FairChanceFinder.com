<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline – FairChance Finder</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f5;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 24px;
    }
    .card {
      background: white;
      border-radius: 16px;
      padding: 40px 32px;
      max-width: 360px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    }
    .icon { font-size: 64px; margin-bottom: 24px; }
    h1 { color: #1a237e; font-size: 24px; margin-bottom: 12px; }
    p { color: #666; line-height: 1.6; margin-bottom: 24px; }
    button {
      background: #1a237e;
      color: white;
      border: none;
      padding: 14px 28px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      width: 100%;
    }
    :focus-visible { outline: 2px solid #1a237e; outline-offset: 2px; }
    button:focus-visible { outline: 2px solid #1a237e; outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
  <div class="card">
    <div class="icon" aria-hidden="true">📶</div>
    <h1>You're offline</h1>
    <p>No internet connection right now. Check your connection and try again — your fair-chance job search will be right here waiting!</p>
    <button onclick="window.location.reload()">Try Again</button>
  </div>
  </main>
</body>
</html>
